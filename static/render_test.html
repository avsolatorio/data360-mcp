<!DOCTYPE html>
<html>
<head>
  <title>Data360 MCP Vega Chart Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 40px;
      background-color: #f8f9fa;
      color: #212529;
    }
    #vis {
      width: 100%;
      max-width: 800px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>
  <h1>Data360 MCP Chart Test</h1>
  <div id="vis"></div>

  <script>
    // Load the generated real population spec
    fetch('/static/viz_specs/real_population_test.json')
      .then(response => response.json())
      .then(spec => {
        vegaEmbed('#vis', spec);
      });
  </script>
</body>
</html>
