      ];
    }
  },
  {
    cat: 'line', id: 'l2',
    title: 'L2: High Value Range (China GDP)',
    desc: 'Ensures the Y-axis uses compact label formatting for trillions, and does not force zero baseline (scale.zero=false) so variation is visible.',
    check(spec) {
      const enc = getEncoding(spec);
      return [
        assert('y.scale.zero === false', enc.y?.scale?.zero === false)
      ];
    }
  },
  {
    cat: 'line', id: 'l3',
    title: 'L3: High Series Count (8 Countries)',
    desc: 'Ensures distinct colors are assigned and the legend supports wide arrangements without overlapping.',
    check(spec) {
      const enc = getEncoding(spec);
      return [
        assert('mark is line', getMarkType(spec) === 'line')
      ];
    }
  },
  {
    cat: 'line', id: 'l4',
    title: 'L4: Typography Wraps Extremely Long Strings',
    desc: 'Ensures both the insanely long indicator title and the 8-country subtitle are converted to arrays for clean text wrapping.',
    check(spec) {
      const title = spec.title || {};
      return [
        assert('title.text is Array (wrapped)', Array.isArray(title.text))
      ];
    }
  },
  {
    cat: 'line', id: 'l5',
    title: 'L5: Negative Values (Argentina GDP Growth)',
    desc: 'Ensures lines can correctly drop below zero and render negative coordinates organically.',
    check(spec) {
      const enc = getEncoding(spec);
      return [
        assert('y.scale.zero === false', enc.y?.scale?.zero === false)
      ];
    }
  },

  // BARS
  {
    cat: 'bar', id: 'b1',
    title: 'B1: High Cardinality Matrix (SSF GDP)',
    desc: 'Test 40+ countries. Explicit chart_type="bar" overrides heatmap fallback. Height dynamically scales to fit all bars without squishing.',
    check(spec) {
      const height = spec.height;
      return [
        assert('height > 500px', (typeof height === 'number' && height > 500))
      ];
    }
  },
  {
    cat: 'bar', id: 'b2',
    title: 'B2: Long Categorical Y-Axis Labels',
    desc: 'Ensures horizontal bars are used, and long country names on the Y-axis are truncated via labelLimit to prevent chart squishing.',
    check(spec) {
      const enc = getEncoding(spec);
      return [
        assert('y.axis.labelLimit exists', enc.y?.axis?.labelLimit > 0)
      ];
    }
  },
  {
    cat: 'bar', id: 'b3',
    title: 'B3: Zero-Baseline Enforcement (Nordic Life Exp)',
    desc: 'GoG strict rule: Bars must ALWAYS originate from 0 to prevent volume deception. scale.zero MUST be true.',
    check(spec) {
      const enc = getEncoding(spec);
      return [
        assert('x.scale.zero === true', enc.x?.scale?.zero === true)
      ];
    }
  },
  {
    cat: 'bar', id: 'b4',
    title: 'B4: Negative Domain Extents (Covid GDP Growth)',
    desc: 'Ensures bars can draw backwards from the 0 baseline into negative coordinates accurately.',
    check(spec) {
      const enc = getEncoding(spec);
      return [
        assert('x.scale.zero === true', enc.x?.scale?.zero === true)
      ];
    }
  },
  {
    cat: 'bar', id: 'b5',
    title: 'B5: Grouped Bar Breakdown (Unemployment by Sex)',
    desc: 'Faceted/Grouped bar chart for categorical breakdowns. Uses xOffset to separate Male/Female bars side-by-side.',
    check(spec) {
      const hasFacet = !!spec.facet || !!spec.spec?.facet;
      const hasXOffset = !!getEncoding(spec).xOffset;
      return [
        assert('Uses facet OR xOffset for grouping', hasFacet || hasXOffset)
      ];
    }
  }
];

window.addEventListener('DOMContentLoaded', () => {
  TESTS.forEach(test => {
    const spec = SPECS[test.id];
    if (!spec) return;
    const results = test.check(spec);
    const passes = results.filter(r => r.pass).length;
    const badgeCls = passes === results.length ? 'badge-pass' : 'badge-fail';
    const badgeText = passes === results.length ? 'PASS' : 'FAIL';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header">
        <div class="card-meta">
          <div class="card-title">${test.title}</div>
          <div class="card-desc">${test.desc}</div>
        </div>
        <span class="summary-badge ${badgeCls}">${badgeText}</span>
      </div>
      <div class="assertions">${results.map(r => `<span class="assert ${r.pass ? 'pass' : 'fail'}">${r.label}</span>`).join('')}</div>
      <div class="vis-container" id="vis-${test.id}"></div>
    `;
    document.getElementById(`tests-${test.cat}`).appendChild(card);
    vegaEmbed(`#vis-${test.id}`, spec, { actions: false });
  });
});
</script>
</body>
</html>
