name: Publish npm packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build --workspaces --if-present

      # Publish only the packages tracked by release-please (in dependency-safe
      # order: mcp-ui depends on mcp-viz-core). Latest version in the workspace
      # always wins; skip anything already on the registry so reruns are safe.
      - name: Publish in-scope @data360 packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -e
          for name in \
            @data360/tool-types \
            @data360/mcp-viz-core \
            @data360/mcp-ui \
            @data360/mcp-ui-angular ; do
            local_ver=$(node -p "require('./packages/${name#@data360/}/package.json').version")
            if npm view "$name@$local_ver" >/dev/null 2>&1; then
              echo "SKIP $name@$local_ver (already on registry)"
              continue
            fi
            echo "PUBLISH $name@$local_ver"
            npm publish --workspace "$name"
          done
