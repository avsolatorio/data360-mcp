repos:
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright --warnings
        language: system
        types: [ python ]
      - id: ruff check
        name: ruff-check
        entry: ruff check --force-exclude --fix
        language: system
        types: [ python ]
      - id: ruff format
        name: ruff-format
        entry: ruff format --force-exclude
        language: system
        types: [ python ]
